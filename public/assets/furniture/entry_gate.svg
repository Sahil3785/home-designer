<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Ground contact shadow -->
  <ellipse cx="300" cy="510" rx="240" ry="16" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Left Concrete Pillar -->
    <rect x="60" y="160" width="60" height="340" rx="4" fill="url(#pillar)"/>
    <rect x="52" y="145" width="76" height="20" rx="3" fill="#475569"/>
    <rect x="56" y="490" width="68" height="15" rx="2" fill="#475569"/>

    <!-- Right Concrete Pillar -->
    <rect x="480" y="160" width="60" height="340" rx="4" fill="url(#pillar)"/>
    <rect x="472" y="145" width="76" height="20" rx="3" fill="#475569"/>
    <rect x="476" y="490" width="68" height="15" rx="2" fill="#475569"/>

    <!-- Gate Frame (Steel Outer Border) -->
    <rect x="130" y="200" width="340" height="290" rx="4" fill="none" stroke="url(#steel)" stroke-width="12"/>
    <line x1="300" y1="200" x2="300" y2="490" stroke="url(#steel)" stroke-width="10"/>

    <!-- Modern Wood Slats / Steel Louvers -->
    <!-- Left Leaf Louvers -->
    <rect x="142" y="222" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="142" y="244" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="142" y="266" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="142" y="288" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="142" y="310" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="142" y="332" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="142" y="354" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="142" y="376" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="142" y="398" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="142" y="420" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="142" y="442" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="142" y="464" width="148" height="12" rx="2" fill="url(#steel)"/>

    <!-- Right Leaf Louvers -->
    <rect x="310" y="222" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="310" y="244" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="310" y="266" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="310" y="288" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="310" y="310" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="310" y="332" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="310" y="354" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="310" y="376" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="310" y="398" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="310" y="420" width="148" height="12" rx="2" fill="url(#steel)"/>
    <rect x="310" y="442" width="148" height="12" rx="2" fill="url(#wood)"/>
    <rect x="310" y="464" width="148" height="12" rx="2" fill="url(#steel)"/>

    <!-- Handles -->
    <rect x="282" y="325" width="8" height="50" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <rect x="310" y="325" width="8" height="50" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>
